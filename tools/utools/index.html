<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 工作记录</title>
    <style>
      /* 启动页常驻,前端在 iframe 里由本地 HTTP 同源托管。
         为什么不用 location.replace:跳转会销毁当前 preload 的 JS 上下文,
         进程内启动的 backend 可能被回收;iframe 让宿主页一直活着,服务稳定。 */
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      #app { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: Canvas; }
      #boot {
        position: absolute; inset: 0; z-index: 1;
        display: flex; align-items: center; justify-content: center;
        background: Canvas;
      }
      .box { max-width: 520px; padding: 24px; text-align: center; }
      .logo { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 18px; font-weight: 600; margin: 16px 0 8px; }
      p { font-size: 13px; line-height: 1.7; opacity: 0.72; margin: 0; }
      .spinner {
        width: 18px; height: 18px; margin: 18px auto 0;
        border: 2px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-top-color: color-mix(in srgb, CanvasText 65%, transparent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .error { color: #c4392f; white-space: pre-wrap; word-break: break-word; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <iframe id="app" title="AI 工作记录" src="about:blank"></iframe>
    <div id="boot">
      <div class="box">
        <img class="logo" src="./logo.png" alt="AI 工作记录" />
        <h1>AI 工作记录</h1>
        <p id="status">正在启动本地服务…</p>
        <div class="spinner" id="spinner"></div>
      </div>
    </div>
    <script>
      (async () => {
        const boot = document.getElementById('boot');
        const app = document.getElementById('app');
        const status = document.getElementById('status');
        const spinner = document.getElementById('spinner');
        try {
          const services = window.atfServices;
          if (!services) throw new Error('preload 未注入,无法启动本地服务');
          // 超时兜底:preload 的 import() 若卡住,不能让页面永远转圈
          const timeout = new Promise((_, reject) => {
            setTimeout(() => reject(new Error('启动超时(20 秒)。请查看 ~/.ai-task-flow/logs/utools.log')), 20000);
          });
          const base = await Promise.race([services.ready, timeout]);
          status.textContent = '正在打开工作记录…';
          app.addEventListener('load', () => boot.remove(), { once: true });
          // 同源加载后端托管的前端:iframe 内 /api 相对路径直接可用,无需 CORS/端口写死。
          // market=1 告诉前端"这是市场版",隐藏会读写用户其他工具配置的入口(Claude 配置切换)。
          app.src = base + '/?market=1';
        } catch (err) {
          spinner.remove();
          status.className = 'error';
          status.textContent = '启动失败:\n' + (err && err.message ? err.message : String(err));
        }
      })();
    </script>
  </body>
</html>
